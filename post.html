<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI &amp; Blockchain Digest</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      line-height: 1.75;
      padding: 2rem 1rem 4rem;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    nav {
      margin-bottom: 2.5rem;
      font-size: 0.875rem;
    }

    nav a {
      color: #58a6ff;
      text-decoration: none;
    }

    nav a:hover { text-decoration: underline; }

    #content h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #f0f6fc;
      border-bottom: 1px solid #21262d;
      padding-bottom: 0.6rem;
    }

    #content h2 {
      font-size: 1.4rem;
      font-weight: 600;
      margin: 2.5rem 0 1rem;
      color: #f0f6fc;
      border-bottom: 1px solid #21262d;
      padding-bottom: 0.4rem;
    }

    #content h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 2rem 0 0.5rem;
      color: #79c0ff;
    }

    #content p { margin: 0.75rem 0; }

    #content a { color: #58a6ff; text-decoration: none; }
    #content a:hover { text-decoration: underline; }

    #content strong { color: #f0f6fc; }

    #content blockquote {
      border-left: 4px solid #30363d;
      padding: 0.5rem 1rem;
      margin: 1rem 0;
      color: #8b949e;
      background: #161b22;
      border-radius: 0 6px 6px 0;
    }

    #content ul, #content ol {
      padding-left: 1.5rem;
      margin: 0.75rem 0;
    }

    #content li { margin: 0.35rem 0; }

    #content hr {
      border: none;
      border-top: 1px solid #21262d;
      margin: 2.5rem 0;
    }

    #content code {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 0.15em 0.4em;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 0.875em;
      color: #ff7b72;
    }

    #content pre {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 1rem;
      overflow-x: auto;
      margin: 1rem 0;
    }

    #content pre code {
      background: none;
      border: none;
      padding: 0;
      color: #e6edf3;
      font-size: 0.875rem;
    }

    #content em { color: #8b949e; font-style: italic; }

    .loading {
      color: #8b949e;
      font-size: 0.95rem;
      padding: 3rem 0;
      text-align: center;
    }

    .error {
      color: #f85149;
      background: #1c1c1c;
      border: 1px solid #f8514940;
      border-radius: 6px;
      padding: 1rem 1.25rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <nav><a href="index.html">&larr; All posts</a></nav>
    <div id="content"><p class="loading">Loading post&hellip;</p></div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const postPath = params.get('post');
    if (!postPath) {
      document.getElementById('content').innerHTML = '<div class="error">No post specified. <a href="index.html">Go back</a>.</div>';
    } else {
      fetch(postPath)
        .then(r => {
          if (!r.ok) throw new Error('Not found');
          return r.text();
        })
        .then(md => {
          document.getElementById('content').innerHTML = marked.parse(md);
          const h1 = document.querySelector('#content h1');
          if (h1) document.title = h1.textContent + ' | AI & Blockchain Digest';
        })
        .catch(() => {
          document.getElementById('content').innerHTML = '<div class="error">Could not load post. <a href="index.html">Go back</a>.</div>';
        });
    }
  </script>
</body>
</html>
